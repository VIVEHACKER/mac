[theme]
base = "light"
primaryColor = "#2c6d5c"
backgroundColor = "#f4f6f1"
secondaryBackgroundColor = "#ffffff"
textColor = "#141815"
font = "sans serif"

[server]
headless = true
address = "127.0.0.1"
fileWatcherType = "none"
runOnSave = false
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false
