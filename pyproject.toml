[project]
name = "trader"
version = "0.1.0"
description = "Multi-strategy quant trading system inspired by top hedge funds"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "nautilus_trader>=1.200",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "alpaca-py>=0.30",
    "ccxt>=4.4",
    "pykrx>=1.0.45",
    # 미시경제 데이터
    "yfinance>=0.2.40",
    "sec-edgar-downloader>=5.0",
    "edgar>=5.0",
    "OpenDartReader>=0.2.1",
    "fmpsdk>=20240801",
    "fredapi>=0.5",
    "pytrends>=4.9",
    "streamlit>=1.40",
    "plotly>=5.24",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "torch>=2.5",
    "torchvision>=0.20",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
